name: Publish release

# Publishes the .wgt from releases/ as a public GitHub Release when a version tag is pushed.
# Release assets of a public repo can be downloaded by anyone, without login and without a daily cap.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish from the current branch, e.g. v8.7.18 (created if missing)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        run: |
          ver="${TAG#v}"
          file="releases/salah-launcher-v${ver}.wgt"
          # A build variant (the -legacy tag, for example) keeps its .wgt out of git and uploads it by hand,
          # so a missing file is only an error when no release of that name exists yet.
          if [ ! -f "$file" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "No $file in the repo for $TAG: the release already exists, nothing to publish."
              exit 0
            fi
            echo "::error::Missing $file for $TAG, and no release named $TAG exists. Commit the .wgt, or upload it by hand."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
          else
            gh release create "$TAG" "$file" --target "$GITHUB_SHA" --title "Salah Launcher v${ver}" --latest \
              --notes "Install the .wgt with Apps2Samsung (custom .wgt). Own package IDs (APLMusalla*): it installs next to APL Launcher and does not replace it. If you have 8.7.17 installed, uninstall it first. MIT licensed, see LICENSE. Untested on a physical TV."
          fi
      - name: Retire superseded files (older builds used APL Launcher's ids or the old name)
        run: |
          for v in 8.7.17 8.7.18 8.7.19; do
            gh release delete-asset "v$v" "$(gh release view "v$v" --json assets --jq '.assets[0].name')" --yes || true
            gh release edit "v$v" --title "Salah Launcher v$v (superseded, use the latest release)" || true
          done
