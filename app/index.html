<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
    <title>Salah Launcher</title>
    <link id="apl-css" rel="stylesheet" href="css/launcher.css">
    <link id="apl-glass-css" rel="stylesheet" href="css/glass.css">
    <!-- This build: the prayer page, the radio, the wallpapers, the Arabic (right-to-left) text -->
    <link id="apl-custom-css" rel="stylesheet" href="css/custom.css">
    <script>
    (function(){
        try {
            var f = document.createElement("div");
            f.style.display = "flex";
            f.style.flexDirection = "column";
            f.style.rowGap = "1px";
            f.appendChild(document.createElement("div"));
            f.appendChild(document.createElement("div"));
            document.documentElement.appendChild(f);
            var ok = (f.scrollHeight === 1);
            f.parentNode.removeChild(f);
            if (!ok) document.documentElement.classList.add("no-flex-gap");
        } catch(e) {
            document.documentElement.classList.add("no-flex-gap");
        }
    })();
    </script>
</head>
<body class="mode-shelf">
    <!-- Top Shelf: full-frame artwork of the selected app (2 layers for the fade) -->
    <div id="bgA" class="bg"></div>
    <div id="bgB" class="bg"></div>
    <!-- Blurred grid background: a small pre-blurred image, nothing computed live -->
    <div id="bgBlur" class="bgblur"></div>
    <div id="skyA" class="sky"></div>
    <div id="skyB" class="sky"></div>
    <div class="scrim"></div>

    <!-- Clock card (top corner): the time, the date beside it, optionally another country's time, the avatar.
         v1.2.50 — filled by js/home-clock.js. #clock keeps its id: it is still "the clock" for the rest of the code. -->
    <div class="status">
        <div class="hc__cell">
            <span id="clock" class="status__clock hc__time"><span id="hcT" class="hc__t">9:41</span><span id="hcS" class="hc__s">AM</span></span>
            <span id="hcLocalLabel" class="hc__label"></span>
        </div>
        <div id="hcDate" class="hc__date">
            <span id="hcDow" class="hc__dow"></span>
            <span id="hcGreg" class="hc__greg"></span>
            <span id="hcHijri" class="hc__hijri"></span>
        </div>
        <div class="hc__cell hc__cell--other">
            <span class="hc__time hc__time--other"><span id="hcT2" class="hc__t"></span><span id="hcS2" class="hc__s"></span></span>
            <span id="hcOtherLabel" class="hc__label hc__label--other"></span>
        </div>
        <span class="status__avatar" aria-hidden="true"></span>
    </div>

    <!-- The Top Shelf film or series: title and rating -->
    <div id="shelfInfo" class="shelfinfo">
        <div id="shelfTitle" class="shelfinfo__title"></div>
        <div id="shelfMeta" class="shelfinfo__meta"></div>
    </div>

    <!-- "Press ▲ for full screen" (launcher.js puts in the translated text) -->
    <div id="hint" class="hint">
        <span class="hint__chevron" aria-hidden="true"></span>
        <span class="hint__text">Press ▲ for full screen</span>
    </div>

    <!-- Home Screen: dock (top row) + the rows below -->
    <main id="home" class="home">
        <div class="dock"><div id="row0" class="row0"></div></div>
        <div id="rows" class="rows"></div>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="boot" class="boot"></div>

    <!-- v1.2.46: visual only. Marks the page while the launcher is not in front (see css/custom.css). -->
    <script>
    (function () {
        function mark() { try { document.documentElement.classList.toggle("apl-away", !!document.hidden); } catch (e) {} }
        document.addEventListener("visibilitychange", mark);
        mark();
    })();
    </script>
    <!-- Samsung API (productinfo, network, avinfo): provided by the screen -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <!-- What this version contains, then start-up: boot.js loads the rest,
         or the newer version downloaded by the automatic update. -->
    <script src="js/build.js"></script>
    <script src="js/boot.js"></script>
</body>
</html>
